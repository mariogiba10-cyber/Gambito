# project.yml — receta que XcodeGen convierte en Gambito.xcodeproj
name: Gambito

options:
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: es

# Paquete local con la lógica de ajedrez (dentro usa ChessKit 0.17.0 exacto)
packages:
  GambitoCore:
    path: GambitoCore

targets:
  Gambito:
    type: application
    platform: iOS
    sources:
      - path: Gambito
    dependencies:
      - package: GambitoCore
    settings:
      base:
        # Identidad de la app. NO cambiar (cuenta gratuita)
        PRODUCT_BUNDLE_IDENTIFIER: com.mariogiba10.gambito
        PRODUCT_NAME: Gambito
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Gambito
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "6.0"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""

schemes:
  Gambito:
    build:
      targets:
        Gambito: all
    run:
      config: Debug
    archive:
      config: Release
