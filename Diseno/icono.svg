<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Icono original de Gambito: un peón dorado (el sacrificio de un gambito) sobre fondo nocturno.
       Sin esquinas redondeadas: iOS aplica la máscara automáticamente. -->
  <defs>
    <!-- Fondo: degradado radial violeta oscuro → casi negro -->
    <radialGradient id="fondo" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#2B2342"/>
      <stop offset="100%" stop-color="#0B0912"/>
    </radialGradient>
    <!-- Halo dorado detrás del peón -->
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F2C46D" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#F2C46D" stop-opacity="0"/>
    </radialGradient>
    <!-- Oro del peón: un único degradado para toda la silueta (userSpaceOnUse) -->
    <linearGradient id="oro" gradientUnits="userSpaceOnUse" x1="0" y1="180" x2="0" y2="870">
      <stop offset="0%" stop-color="#FBE3A6"/>
      <stop offset="55%" stop-color="#E2B35A"/>
      <stop offset="100%" stop-color="#B7832F"/>
    </linearGradient>
    <!-- Tablero 8x8 muy sutil de fondo (casillas de 128 px) -->
    <pattern id="tablero" width="256" height="256" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="128" height="128" fill="#FFFFFF"/>
      <rect x="128" y="128" width="128" height="128" fill="#FFFFFF"/>
    </pattern>
    <!-- Desenfoque para la sombra en el suelo -->
    <filter id="desenfoque" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- Capas de fondo -->
  <rect width="1024" height="1024" fill="url(#fondo)"/>
  <rect width="1024" height="1024" fill="url(#tablero)" opacity="0.045"/>
  <circle cx="512" cy="500" r="400" fill="url(#halo)"/>
  <ellipse cx="512" cy="874" rx="300" ry="36" fill="#000000" opacity="0.55" filter="url(#desenfoque)"/>

  <!-- Peón: cuerpo, base de dos escalones, cuello, collarín y cabeza -->
  <path d="M 436 490 C 436 580 390 680 344 760 L 680 760 C 634 680 588 580 588 490 Z" fill="url(#oro)"/>
  <rect x="300" y="748" width="424" height="64" rx="32" fill="url(#oro)"/>
  <rect x="256" y="796" width="512" height="72" rx="36" fill="url(#oro)"/>
  <line x1="316" y1="798" x2="708" y2="798" stroke="#7A5220" stroke-opacity="0.45" stroke-width="5"/>
  <rect x="470" y="400" width="84" height="70" fill="url(#oro)"/>
  <ellipse cx="512" cy="468" rx="160" ry="38" fill="url(#oro)" stroke="#9C6B27" stroke-opacity="0.6" stroke-width="4"/>
  <circle cx="512" cy="300" r="118" fill="url(#oro)"/>
  <!-- Brillo en la cabeza -->
  <ellipse cx="470" cy="255" rx="42" ry="30" fill="#FFFFFF" opacity="0.35"/>
</svg>
